<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netwerkinfrastructuur Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
}

header{
    background:#2563eb;
    text-align:center;
    padding:30px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

.progress{
    background:#334155;
    height:20px;
    border-radius:10px;
    overflow:hidden;
}

.progress-fill{
    background:#22c55e;
    height:100%;
    width:0%;
    transition:0.3s;
}

.answer{
    background:#334155;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    cursor:pointer;
}

.answer:hover{
    background:#475569;
}

.correct{
    background:#16a34a !important;
}

.wrong{
    background:#dc2626 !important;
}

.feedback{
    margin-top:15px;
    padding:15px;
    background:#475569;
    border-radius:8px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#nextBtn{
    display:none;
    margin-top:20px;
}
</style>
</head>

<body>

<header>
<h1>💻 Netwerkinfrastructuur Quiz</h1>
<p>TCP/IP • Subnetting • VLAN • Inter-VLAN Routing</p>
</header>

<div class="container">

<div class="card">

<h2>Voortgang</h2>

<div class="progress">
    <div id="progressFill"
         class="progress-fill">
    </div>
</div>

<p id="counter"></p>

</div>

<div class="card">

<div id="quiz"></div>

<button id="nextBtn">
Volgende vraag →
</button>

</div>

</div>

<script>

const questions = [

{
question:"Wat is het doel van een IP-adres?",
answers:[
"Een apparaat identificeren",
"Een VLAN maken",
"Een switch resetten",
"Een kabel testen"
],
correct:0,
correctFeedback:"✅ Correct! Een IP-adres identificeert een apparaat op een netwerk.",
wrongFeedback:"❌ Niet correct. Een IP-adres wordt gebruikt om apparaten op een netwerk te identificeren."
},

{
question:"Hoeveel bits heeft een IPv4-adres?",
answers:[
"16",
"32",
"64",
"128"
],
correct:1,
correctFeedback:"✅ Correct! IPv4 bestaat uit 32 bits.",
wrongFeedback:"❌ Niet correct. IPv4 bestaat uit 32 bits."
},

{
question:"Hoeveel bruikbare hosts heeft een /26 subnet?",
answers:[
"30",
"62",
"126",
"254"
],
correct:1,
correctFeedback:"✅ Correct! 64 adressen - 2 = 62 hosts.",
wrongFeedback:"❌ Niet correct. Een /26 subnet heeft 62 bruikbare hosts."
},

{
question:"Wat doet een VLAN?",
answers:[
"Meer snelheid",
"Logische netwerkscheiding",
"Meer geheugen",
"DNS vervangen"
],
correct:1,
correctFeedback:"✅ Correct! VLAN's delen een netwerk logisch op.",
wrongFeedback:"❌ Niet correct. VLAN's worden gebruikt om een netwerk logisch te scheiden."
},

{
question:"Welke poort transporteert meerdere VLAN's?",
answers:[
"Access",
"Trunk",
"USB",
"Console"
],
correct:1,
correctFeedback:"✅ Correct! Een trunk vervoert meerdere VLAN's.",
wrongFeedback:"❌ Niet correct. Een trunkpoort transporteert verkeer van meerdere VLAN's."
}

];

let currentQuestion = 0;
let score = 0;

function renderQuestion(){

const q = questions[currentQuestion];

document.getElementById("counter").innerHTML =
`Vraag ${currentQuestion + 1} van ${questions.length}`;

let html =
`<h2>${q.question}</h2>`;

q.answers.forEach((answer,index)=>{

html += `
<div class="answer"
onclick="checkAnswer(${index})">
${answer}
</div>
`;

});

document.getElementById("quiz").innerHTML =
html;

document.getElementById("nextBtn").style.display =
"none";

updateProgress();

}

function checkAnswer(index){

const q = questions[currentQuestion];

const answerElements =
document.querySelectorAll(".answer");

answerElements.forEach(el=>{
el.style.pointerEvents = "none";
});

let feedback = "";

if(index === q.correct){

score++;

answerElements[index]
.classList.add("correct");

feedback = q.correctFeedback;

}else{

answerElements[index]
.classList.add("wrong");

answerElements[q.correct]
.classList.add("correct");

feedback =
q.wrongFeedback +
"<br><br><strong>Juiste antwoord:</strong> " +
q.answers[q.correct];

}

document.getElementById("quiz").innerHTML +=
`
<div class="feedback">
${feedback}
</div>
`;

document.getElementById("nextBtn").style.display =
"inline-block";

}

function updateProgress(){

const percentage =
(currentQuestion / questions.length) * 100;

document.getElementById("progressFill")
.style.width =
percentage + "%";

}

function showResult(){

document.getElementById("progressFill")
.style.width = "100%";

let niveau = "";

if(score === questions.length){

niveau = "🏆 Cisco Expert";

}else if(score >= 4){

niveau = "✅ Netwerkbeheerder";

}else if(score >= 3){

niveau = "⚡ Junior Engineer";

}else{

niveau = "📚 Nog oefenen";
}

document.getElementById("quiz").innerHTML =

`
<h2>🎉 Quiz voltooid!</h2>

<h3>Score: ${score}/${questions.length}</h3>

<p>${niveau}</p>
`;

document.getElementById("counter").innerHTML =
"";

document.getElementById("nextBtn")
.style.display = "none";

}

document.getElementById("nextBtn")
.addEventListener("click",function(){

currentQuestion++;

if(currentQuestion < questions.length){

renderQuestion();

}else{

showResult();

}

});

renderQuestion();

</script>

</body>
</html>
